<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gaming Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Gaming Portal</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">Games</a>
            <a href="#">Esports</a>
            <a href="#">News</a>
        </nav>
    </header>

    <main>

        <section class="hero">
            <h2>Welcome to Gaming Portal</h2>

            <p>
                Explore games, esports, gaming news and tournaments
                all in one place.
            </p>

            <button onclick="welcomeMessage()">Explore Now</button>
        </section>

        <section class="games">
            <h2>Popular Games</h2>

            <div class="game-container">

                <div class="game-card">
                    <h3>Valorant</h3>
                    <p>Competitive tactical shooter.</p>
                </div>

                <div class="game-card">
                    <h3>BGMI</h3>
                    <p>Popular battle royale game.</p>
                </div>

                <div class="game-card">
                    <h3>Free Fire</h3>
                    <p>Fast-paced battle royale game.</p>
                </div>

            </div>
        </section>

    </main>

    <footer>
        <p>© 2026 Gaming Portal</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid Layout</title>

    <style>
        .container {
            display: grid;

            /* 4 equal columns */
            grid-template-columns: repeat(4, 1fr);

            /* 5 rows */
            grid-template-rows: 120px 180px 180px 120px;

            gap: 5px;

            width: 100%;
            height: 700px;

            font-family: Arial, sans-serif;
            text-align: center;
        }

        .box {
            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 30px;
            font-weight: bold;
        }

        /* Header */
        .header {
            grid-column: 1 / 5;
            grid-row: 1 / 2;

            background-color: orangered;
            color: white;

            flex-direction: column;
        }

        /* Small Boxes */
        .smallbox1 {
            grid-column: 1 / 2;
            grid-row: 2 / 3;

            background-color: #18a9e8;
        }

        .smallbox2 {
            grid-column: 2 / 3;
            grid-row: 2 / 3;

            background-color: #18a9e8;
        }

        .smallbox3 {
            grid-column: 3 / 4;
            grid-row: 2 / 3;

            background-color: #18a9e8;
        }

        /* Sidebar */
        .sidebar {
            grid-column: 4 / 5;
            grid-row: 2 / 4;

            background-color: #40d979;
        }

        /* Main Content */
        .main {
            grid-column: 1 / 4;
            grid-row: 3 / 4;

            background-color: yellow;
        }

        /* Footer */
        .footer {
            grid-column: 1 / 5;
            grid-row: 4 / 5;

            background-color: blue;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="box header">
        <div>Header Element</div>
        <div>
            Home &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            About &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            Login
        </div>
    </div>

    <div class="box smallbox1">
        SmallBox1
    </div>

    <div class="box smallbox2">
        SmallBox2
    </div>

    <div class="box smallbox3">
        SmallBox3
    </div>

    <div class="box sidebar">
        Side Bar
    </div>

    <div class="box main">
        MainContent
    </div>

    <div class="box footer">
        Footer
    </div>

</div>

</body>
</html>
